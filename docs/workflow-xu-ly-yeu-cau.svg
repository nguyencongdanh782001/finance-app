<path class="l" d="M700 1070V1100"/><rect class="a" x="430" y="1100" width="540" height="70" rx="9"/><text class="h" x="700" y="1133" text-anchor="middle">9. Trả JSON Response</text><text class="p" x="700" y="1154" text-anchor="middle">Giao diện cập nhật dữ liệu và hiển thị kết quả</text>
