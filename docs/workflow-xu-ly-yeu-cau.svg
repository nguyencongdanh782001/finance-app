<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500">
<defs><style>.a{fill:#e5f0ff;stroke:#6090d8;stroke-width:2}.b{fill:#e6f7ea;stroke:#69aa7b;stroke-width:2}.c{fill:#fff3cf;stroke:#d4a843;stroke-width:2}.d{fill:#f0e9ff;stroke:#9671cf;stroke-width:2}.e{fill:#ffe5e5;stroke:#d66b6b;stroke-width:2}.t{font:700 24px Arial;fill:#202938}.h{font:700 17px Arial;fill:#202938}.p{font:14px Arial;fill:#27364a}.l{stroke:#607fae;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#607fae"/></marker></defs>
<rect width="1400" height="1500" fill="white"/><text class="t" x="700" y="45" text-anchor="middle">WORKFLOW XỬ LÝ YÊU CẦU TRONG NEXT.JS FULL-STACK</text>
<rect class="a" x="105" y="85" width="1190" height="130" rx="12"/><text class="h" x="700" y="120" text-anchor="middle">TẦNG GIAO DIỆN</text><rect class="a" x="190" y="140" width="360" height="55" rx="8"/><text class="h" x="370" y="174" text-anchor="middle">Storefront Next.js / React</text><rect class="b" x="850" y="140" width="360" height="55" rx="8"/><text class="h" x="1030" y="174" text-anchor="middle">Admin Next.js / React</text>
<path class="l" d="M370 215V255H700V285"/><path class="l" d="M1030 215V255H700V285"/>
<rect class="d" x="285" y="285" width="830" height="990" rx="14"/><text class="h" x="700" y="325" text-anchor="middle">NEXT.JS API ROUTE HANDLERS</text>
<rect class="a" x="430" y="360" width="540" height="70" rx="9"/><text class="h" x="700" y="393" text-anchor="middle">1. Nhận HTTP Request</text><text class="p" x="700" y="414" text-anchor="middle">REST API / JSON / Query Parameters</text>
<path class="l" d="M700 430V455"/><rect class="b" x="430" y="455" width="540" height="70" rx="9"/><text class="h" x="700" y="488" text-anchor="middle">2. Middleware và kiểm tra phiên</text><text class="p" x="700" y="509" text-anchor="middle">Cookie, access token, rate limit, logging</text>
<path class="l" d="M700 525V550"/><rect class="c" x="430" y="550" width="540" height="70" rx="9"/><text class="h" x="700" y="583" text-anchor="middle">3. Route Handler / Endpoint</text><text class="p" x="700" y="604" text-anchor="middle">Xác định đường dẫn và nghiệp vụ tương ứng</text>
<path class="l" d="M700 620V645"/><rect class="c" x="335" y="645" width="330" height="90" rx="9"/><text class="h" x="500" y="680" text-anchor="middle">4A. Authentication</text><text class="p" x="500" y="704" text-anchor="middle">Kiểm tra user và quyền admin</text><rect class="e" x="735" y="645" width="330" height="90" rx="9"/><text class="h" x="900" y="680" text-anchor="middle">4B. Validation</text><text class="p" x="900" y="704" text-anchor="middle">Zod / kiểm tra dữ liệu đầu vào</text>
<path class="l" d="M500 735V770H700V795"/><path class="l" d="M900 735V770H700V795"/>
<rect class="b" x="430" y="795" width="540" height="75" rx="9"/><text class="h" x="700" y="830" text-anchor="middle">5. Business Logic</text><text class="p" x="700" y="851" text-anchor="middle">Đơn hàng, sản phẩm, tài chính, thanh toán, vận chuyển</text>
<path class="l" d="M700 870V895"/><rect class="b" x="430" y="895" width="540" height="75" rx="9"/><text class="h" x="700" y="930" text-anchor="middle">6. Prisma ORM / Data Access</text><text class="p" x="700" y="951" text-anchor="middle">Tạo truy vấn và transaction đến cơ sở dữ liệu</text>
<path class="l" d="M970 932H1170"/><rect class="c" x="1170" y="875" width="190" height="125" rx="9"/><text class="h" x="1265" y="915" text-anchor="middle">7. PostgreSQL</text><text class="p" x="1265" y="945" text-anchor="middle">Lưu và truy vấn</text><text class="p" x="1265" y="968" text-anchor="middle">dữ liệu hệ thống</text>
